<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | 松本農園</title>
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <header class="page-header">
        <h1 class="page-title">
            <span class="en" lang="en">Contact</span>
            <span class="ja">お問い合わせ</span>
        </h1>
    </header>

    <main>
        <section class="contact-form-section">
            <p>収穫時期、ご予約等、お気軽にお問い合わせくださいませ。</p>
            <p>お問い合わせ内容の確認後、折り返しご連絡させていただきます。</p>

            <form action="send.php" method="POST">

                <div class="form-group">
                    <label for="name">お名前 <span class="required">必須</span></label>
                    <input type="text" id="name" name="user_name" placeholder="山田太郎" required>
                </div>

                <div class="form-group">
                    <label for="email">メールアドレス <span class="required">必須</span></label>
                    <input type="email" id="email" name="user_email" placeholder="メールアドレスをご記入ください" required>
                </div>

                <div class="form-group">
                    <label for="i_tel">電話番号</label>
                    <input id="i_tel" type="tel" name="tel" value="" inputmode="tel" placeholder="080-1234-5678">
                </div>

                <!--テキストエリア-->
                <div class="form-group">
                    <label for="message">お問い合わせ内容 <span class="required">必須</span></label>
                    <textarea id="message" name="message" cols="30" rows="10" required></textarea>
                </div>


                <input type="submit" value="送信する" aria-label="送信する">


            </form>
        </section>
    </main>



    <script src="js/contact.js" defer></script>
</body>

</html>
